name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev libssl-dev pkg-config

      - name: Stub sidecar and bundle resources for CI
        run: |
          mkdir -p src-tauri/sidecar src-tauri/config src-tauri/db
          printf '#!/bin/sh\necho zolai-api-ci-stub\n' > src-tauri/sidecar/zolai-api-x86_64-unknown-linux-gnu
          chmod +x src-tauri/sidecar/zolai-api-x86_64-unknown-linux-gnu
          # bundle.resources must exist on disk for tauri-build
          test -f src-tauri/config/llm_providers.yaml || echo 'providers: []' > src-tauri/config/llm_providers.yaml
          test -f src-tauri/db/schema.sql || echo '-- ci stub schema' > src-tauri/db/schema.sql

      - name: Build
        run: cargo build
        working-directory: src-tauri

      - name: Test
        run: cargo test
        working-directory: src-tauri
