[package]
name = "zolai-desktop"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
rusqlite = { version = "0.32", features = ["bundled", "load_extension"] }

[profile.release]
# Trade a small binary-size increase for a faster release build:
# thin LTO + more codegen units shorten the critical path for a desktop bundle.
lto = "thin"
codegen-units = 16
strip = true

