[package]
name = "zolai-desktop"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
rusqlite = { version = "0.32", features = ["bundled", "load_extension"] }
tokio-postgres = { version = "0.7", optional = true }
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["full"] }
log = "0.4"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
# Default build stays SQLite-only (offline-first desktop app; no server needed).
# `cargo build --features postgres` adds the PostgreSQL path (src/db/mod.rs),
# selected at runtime via ZOLAI_TAURI_DB_URL / ZOLAI_DB_URL.
default = []
postgres = ["dep:tokio-postgres"]

[profile.release]
# Trade a small binary-size increase for a faster release build:
# thin LTO + more codegen units shorten the critical path for a desktop bundle.
lto = "thin"
codegen-units = 16
strip = true

